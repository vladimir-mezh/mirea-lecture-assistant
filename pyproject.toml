[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mirea-lecture-assistant"
version = "0.2.6"
description = "Desktop assistant for MIREA online lectures and attendance QR codes"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "PySide6>=6.7,<7",
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "pymirea>=0.3.3,<0.5",
  "keyring>=25,<26",
  "mss>=10,<11",
  "Pillow>=11,<13",
  "truststore>=0.9,<1",
  "websockets>=15,<16",
  "zxing-cpp>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "qrcode>=8,<9", "ruff>=0.8,<1"]
opencv = ["opencv-python>=4.10,<5"]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
mirea-lecture-assistant = "mirea_lecture_assistant.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mirea_lecture_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
